[build-system]
requires = ["poetry-core>=2.0.0", "poetry-dynamic-versioning>=1.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

# Project configuration
# ---------------------

[project]
name = "sds-utils"
description = "Utilities and diagnostics for SDS developers and operators"
authors = [{name = "IMAP SDC Developers", email = "imap-sdc@lists.lasp.colorado.edu"}]
readme = "README.md"
license = "MIT"
keywords = ["IMAP", "SDC", "SOC", "Science Operations"]
requires-python = ">=3.10,<4"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "imap-data-access (>=1.1.0,<2.0.0)",
    "numpy (>=2,<3)",
    "tqdm (>=4.70.0,<5.0.0)"
]

[tool.poetry]
version = "0.0.0"

[project.urls]
homepage = "https://github.com/IMAP-Science-Operations-Center"
repository = "https://github.com/IMAP-Science-Operations-Center/sds-utils"

# Dependencies
# ------------

[project.optional-dependencies]
dashboard = ["nicegui>=3.16.0,<4.0.0", "ariadne-codegen>=0.18.0,<0.19.0", "sqlmodel>=0.0.39,<0.0.40"]
dev = ["pre-commit>=3.3.3,<4", "ruff==0.15.2", "mypy==1.10.1"]
doc = ["numpydoc>=1.5.0,<2", "pydata-sphinx-theme", "sphinx", "sphinxcontrib-openapi>=0.8.3,<0.9"]
notebook = ["marimo>=0.24.0,<0.25.0", "pandas>=2,<3"]
test = ["pytest>=6.2.5", "pytest-cov>=4.0.0,<5", "pytest-xdist>=3.2,<4"]


[project.scripts]
ariadne-codegen = "sds_utils.dashboard.codegen:main"


# Tool settings
# -------------

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
    "ignore:Converting non-nanosecond:UserWarning:cdflib",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:cdflib",
    # Ignore Data_version warnings during tests because we default to v001
    "ignore:No Data_version attribute found:UserWarning:imap_processing",
    # Some test packet data is of the incorrect length and causes many warnings
    # that can be ignored for testing purposes
    "ignore:Number of bits:UserWarning:space_packet_parser",
]
markers = [
    "external_kernel: marks tests as requiring external SPICE kernels (deselect with '-m \"not external_kernel\"')",
    "external_test_data: marks tests as requiring external test data (deselect with '-m \"not external_test_data\"')",
    "use_test_metakernel: Mark test to use a test metakernel"
]

[tool.ruff]
target-version = "py310"
lint.select = ["B", "D", "E", "F", "I", "N", "S", "W", "PL", "PT", "UP", "RUF"]
lint.ignore = [
  "D104",  # Missing docstring in public package
]
extend-exclude = [
    "test_*.py",
    "sds_utils/dashboard/dagster_graphql_client",  # code generated by ariadne-codegen
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Dashboard views contain many framework lifecycle methods whose names already
# describe their role; requiring one-line docstrings on each adds little value.
"sds_utils/dashboard/frontend/*.py" = ["D100", "D101", "D102", "D103"]
# Generated GraphQL model names and embedded Vue templates cannot be usefully
# wrapped to the normal Python line length.
"sds_utils/dashboard/backend/data.py" = ["E501", "PLR0912", "PLR0913", "PLR0915"]
"sds_utils/dashboard/frontend/elems.py" = ["E501", "PLR0913", "RUF012"]
"sds_utils/dashboard/frontend/backfills.py" = ["E501", "RUF012"]
"sds_utils/dashboard/backend/partition_classifier.py" = ["E501", "PLR0913"]

[tool.codespell]
ignore-words-list = "livetime,nd"

[tool.numpydoc_validation]
checks = ["all", #report on all checks, except the following
    "EX01", # Ignore No examples section found
    "SA01", # Ignore See Also section not found
    "ES01", # Ignore No extended summary found
    "RT02" ] # Ignore The first line of the Returns section
exclude = ['__init__', '_version'] # don't report on objects that match any of these regex
override_SS05 = [  # override SS05 to allow docstrings starting with these words
    '^Process ',
]

[tool.mypy]
disable_error_code = ['import-not-found', # Unable to locate module or package specified
                'import-untyped', # The import lacks type information
                'no-untyped-call', # Function calls are only made to functions that are fully typed
                'type-arg', # Requires type arguments to be specified in list[] and dict[]
                'union-attr', # Item "float" of "float | Any" has no attribute "reshape"
                'no-any-return', # Returning Any from a function
              ]
strict = true
explicit_package_bases = true
exclude = [
    "test_*",
    "sds_utils/dashboard/dagster_graphql_client",  # code generated by ariadne-codegen
]

[tool.ariadne-codegen]
remote_schema_url = "${DAGSTER_BASE_URL}/graphql"
queries_path = "sds_utils/dashboard/graphql"
target_package_name = "dagster_graphql_client"
target_package_path = "sds_utils/dashboard"
client_name = "DagsterGraphQLClient"
async_client = false
include_all_inputs = false
include_all_enums = false
include_comments = "none"  # prevent dagster url from being put in source file comments
